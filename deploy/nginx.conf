# nginx site for a regional Momentum server (e.g. /etc/nginx/sites-available/momentum)
# TLS certificates via certbot:  certbot --nginx -d sg.example.com

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name sg.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name sg.example.com;

  ssl_certificate     /etc/letsencrypt/live/sg.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/sg.example.com/privkey.pem;

  # Real-time traffic: WebSocket upgrade, no buffering, long timeouts.
  location /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    tcp_nodelay on;
  }

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
